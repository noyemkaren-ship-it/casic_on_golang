<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐅 Казино Тигра</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0d0d1a;
            color: #cdd6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Фоновые огоньки */
        .bg-lights {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .light {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245,197,66,0.3) 0%, transparent 70%);
            animation: float 6s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
            50% { transform: translateY(-30px) scale(1.5); opacity: 0.7; }
        }

        .box {
            background: linear-gradient(145deg, #1a1a35 0%, #12122a 100%);
            padding: 50px 40px;
            border-radius: 24px;
            width: 420px;
            text-align: center;
            box-shadow: 0 0 60px rgba(245,197,66,0.15), 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #2a2a4a;
            z-index: 10;
            position: relative;
        }

        h1 {
            color: #f5c542;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(245,197,66,0.4);
        }

        .balance-label {
            color: #8888aa;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .balance {
            font-size: 3rem;
            color: #a6e3a1;
            font-weight: 800;
            text-shadow: 0 0 30px rgba(166,227,161,0.5);
            margin-bottom: 25px;
            transition: all 0.3s;
        }

        .balance.shake {
            animation: shake 0.5s ease-in-out;
            color: #f38ba8;
            text-shadow: 0 0 30px rgba(243,139,168,0.7);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .message {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 10px;
            animation: popIn 0.4s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .win {
            color: #a6e3a1;
            background: rgba(166,227,161,0.1);
            border: 1px solid rgba(166,227,161,0.3);
        }

        .lose {
            color: #f38ba8;
            background: rgba(243,139,168,0.1);
            border: 1px solid rgba(243,139,168,0.3);
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 12px;
            border: 2px solid #2a2a4a;
            background: #0d0d1a;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #f5c542;
            box-shadow: 0 0 20px rgba(245,197,66,0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(145deg, #f5c542, #d4a017);
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(245,197,66,0.3);
        }

        button:active {
            transform: scale(0.96);
        }

        .logout {
            display: inline-block;
            margin-top: 18px;
            color: #89b4fa;
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .logout:hover {
            opacity: 1;
            text-decoration: underline;
        }

        /* Конфетти */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- Фоновые огоньки -->
    <div class="bg-lights">
        <div class="light" style="top:10%;left:15%;width:60px;height:60px;animation-delay:0s;"></div>
        <div class="light" style="top:70%;left:80%;width:80px;height:80px;animation-delay:2s;"></div>
        <div class="light" style="top:30%;left:70%;width:40px;height:40px;animation-delay:4s;"></div>
        <div class="light" style="top:80%;left:20%;width:50px;height:50px;animation-delay:1s;"></div>
    </div>

    <!-- Канвас для конфетти -->
    <canvas id="confetti"></canvas>

    <div class="box">
        <h1>🐅 Казино Тигра</h1>
        <p class="balance-label">Твой баланс</p>
        <p class="balance" id="balance">💰 {{ .Balance }}</p>

        {{ if .Message }}
            <p class="message 
                {{ if eq .Message "Ты выиграл!" }}win
                {{ else if eq .Message "Ты проиграл!" }}lose
                {{ end }}" id="message">
                
                {{ if eq .Message "Ты выиграл!" }}🎉 Ты выиграл!
                {{ else if eq .Message "Ты проиграл!" }}💀 Ты проиграл!
                {{ else }}⚠️ {{ .Message }}
                {{ end }}
            </p>
        {{ end }}
        
        <form action="/play" method="POST" onsubmit="disableButton()">
            <input type="number" name="amount" id="amount" placeholder="Сумма ставки" required min="1">
            <button type="submit" id="playBtn">🎰 Играть</button>
        </form>

        <a class="logout" href="/logout">🚪 Выйти</a>
    </div>

    <script>
        const confettiCanvas = document.getElementById('confetti');
        const ctx = confettiCanvas.getContext('2d');
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;

        let particles = [];
        let animationId;

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 10 + 5;
                this.speedX = Math.random() * 6 - 3;
                this.speedY = Math.random() * -8 - 2;
                this.color = ['#f5c542', '#a6e3a1', '#f38ba8', '#89b4fa', '#cba6f7'][Math.floor(Math.random() * 5)];
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 10 - 5;
                this.gravity = 0.15;
                this.opacity = 1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += this.gravity;
                this.rotation += this.rotationSpeed;
                this.opacity -= 0.005;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size * 0.6);
                ctx.restore();
            }
        }

        function startConfetti() {
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle(window.innerWidth / 2, window.innerHeight / 2));
            }
            if (!animationId) {
                animate();
            }
            setTimeout(() => {
                cancelAnimationFrame(animationId);
                animationId = null;
                particles = [];
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }, 2500);
        }

        function animate() {
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].opacity <= 0 || particles[i].y > confettiCanvas.height) {
                    particles.splice(i, 1);
                }
            }
            if (particles.length > 0) {
                animationId = requestAnimationFrame(animate);
            }
        }

        // Запускаем конфетти при выигрыше
        const messageEl = document.getElementById('message');
        if (messageEl && messageEl.classList.contains('win')) {
            startConfetti();
            const balanceEl = document.getElementById('balance');
            balanceEl.style.transform = 'scale(1.2)';
            setTimeout(() => { balanceEl.style.transform = 'scale(1)'; }, 300);
        }

        // Трясём баланс при проигрыше
        if (messageEl && messageEl.classList.contains('lose')) {
            const balanceEl = document.getElementById('balance');
            balanceEl.classList.add('shake');
            setTimeout(() => { balanceEl.classList.remove('shake'); }, 500);
        }

        function disableButton() {
            const btn = document.getElementById('playBtn');
            btn.textContent = '🎰 Крутим...';
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';
        }

        window.addEventListener('resize', () => {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
